services:
  proxy:
    image: node:22-alpine
    container_name: proxy
    env_file:
      - .env
    command: node /client/proxy.js
    ports:
      - "3000:3000"
    volumes:
      - ./client:/client

  spark-master:
    image: apache/spark:4.1.1-scala2.13-java17-ubuntu
    container_name: spark-master
    hostname: spark-master
    working_dir: /wordCountConsult
    environment:
      - SPARK_PUBLIC_DNS=localhost
    env_file:
      - .env
    depends_on:
      - proxy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./wordCountConsult:/wordCountConsult

  spark-worker-1:
    image: apache/spark:4.1.1-scala2.13-java17-ubuntu
    container_name: spark-worker-1
    working_dir: /wordCountConsult
    environment:
      - CSV_PATH=/wordCountConsult/csv/wordsCount.csv
      - SPARK_PUBLIC_DNS=localhost
      # puerto distinto para la UI del driver si cae en este worker (modo cluster)
      - JAVA_TOOL_OPTIONS=-Dspark.ui.port=4041
    env_file:
      - .env
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    ports:
      - "8081:8081"
      - "4041:4041"
    volumes:
      - ./wordCountConsult:/wordCountConsult

  spark-worker-2:
    image: apache/spark:4.1.1-scala2.13-java17-ubuntu
    container_name: spark-worker-2
    working_dir: /wordCountConsult
    environment:
      - CSV_PATH=/wordCountConsult/csv/wordsCount.csv
      - SPARK_PUBLIC_DNS=localhost
      # puerto distinto para la UI del driver si cae en este worker (modo cluster)
      - JAVA_TOOL_OPTIONS=-Dspark.ui.port=4042
    env_file:
      - .env
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8082
    ports:
      - "8082:8082"
      - "4042:4042"
    volumes: 
      - ./wordCountConsult:/wordCountConsult

  spark-submit:
    image: apache/spark:4.1.1-scala2.13-java17-ubuntu
    container_name: spark-submit
    working_dir: /wordCountConsult
    environment:
      - SPARK_PUBLIC_DNS=localhost
    env_file:
      - .env
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    command:
      - /bin/bash
      - -c
      - |
        sleep 15
        if [ "$${MODO_CLUSTER:-false}" = "true" ]; then MODE=cluster; else MODE=client; fi
        echo "Lanzando spark-submit en modo $$MODE"
        /opt/spark/bin/spark-submit --class es.upm.dit.WordConsultStreamingJob --master spark://spark-master:7077 --deploy-mode $$MODE /wordCountConsult/target/scala-2.13/word-consult-streaming_2.13-1.0.jar
    ports:
      - "4040:4040"
    volumes:
      - ./wordCountConsult:/wordCountConsult